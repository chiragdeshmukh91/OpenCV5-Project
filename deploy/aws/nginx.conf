# /etc/nginx/sites-available/clearpath  (installed by user-data.sh)
# Port 80 is restricted by the security group to the CIDR given to provision.sh. Plain HTTP: demo use only.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 200m;   # matches the API's upload limit
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Read-only proof of where the OpenCV workload runs (machine, EC2 instance type, OpenCV build, COOL state).
    location = /v1/health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8100/v1/health;
        proxy_set_header Host $host;
    }

    # Everything else (API, run media, built frontend) goes to the CLEARPATH API.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
